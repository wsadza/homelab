# ===============================
components:

  # ------------------
  # app 
  # ------------------
  
  - name: app 
    namespace: external-dns

    enabled: true
    priority: 0

    syncPolicy:
      automated: false

    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        targetRevision: 1.20.0
        chart: external-dns
        valueFiles: 
          - $values/platform-products/infra-core/applications/external-dns/components/app/helm/values.yml

      - type: kustomize 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-core/applications/external-dns/components/app/kustomize
