# : AppStorage
# ===============================================

appStorage:

  # ===============================================
  # @section blob parameters
  # ===============================================
  #
  blob:
    enabled: true

  # ===============================================
  # @section psql parameters
  # ===============================================
  #
  psql:
    enabled: true
    storage:
      size: 50Gi
    objectStore:
      destinationPath: "s3://nextcloud-bucket/databases"
      endpointURL: "http://seaweed-filer.seaweedfs.svc.cluster.local:8333"
