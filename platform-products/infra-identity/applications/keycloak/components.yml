# ===============================
# 
# ===============================
components:

  # ------------------
  # app 
  # ------------------

  - name: app
    namespace: keycloak

    enabled: true
    priority: 0

    syncPolicy:
      automated: false

    sources:

      - type: manifests 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-identity/applications/keycloak/components/app/manifests

      - type: kustomize 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-identity/applications/keycloak/components/app/kustomize

  # ------------------
  # app-exposure
  # ------------------

  - name: app-exposure
    namespace: keycloak

    enabled: true
    priority: 5

    syncPolicy:
      automated: false

    sources:

      - type: helm 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-charts/wrappers/app-exposure
        valueFiles: 
          - $values/platform-products/infra-identity/applications/keycloak/components/app-exposure/helm/values.yml

  # ------------------
  # app-storage
  # ------------------

  - name: app-storage
    namespace: keycloak

    enabled: true
    priority: -5

    syncPolicy:
      automated: false

    sources:

      - type: helm 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-charts/wrappers/app-storage
        valueFiles: 
          - $values/platform-products/infra-identity/applications/keycloak/components/app-exposure/helm/values.yml
