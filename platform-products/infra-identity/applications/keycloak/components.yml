# ===============================
# 
# ===============================
components:

  # ------------------
  # core
  # ------------------

  - name: core
    namespace: keycloak

    enabled: true
    priority: 0

    syncPolicy:
      automated: false

    sources:

      - type: manifests 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-identity/applications/keycloak/components/core/manifests

      - type: kustomize 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-identity/applications/keycloak/components/core/kustomize

  # ------------------
  # exposure
  # ------------------

  - name: exposure
    namespace: keycloak

    enabled: true
    priority: 5

    syncPolicy:
      automated: false

    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-charts/wrappers/app-exposure
        valueFiles: 
          - $values/platform-products/infra-identity/applications/keycloak/components/exposure/helm/values.yml

  # ------------------
  # storage
  # ------------------

  - name: storage
    namespace: keycloak

    enabled: true
    priority: -5

    syncPolicy:
      automated: false

    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-charts/wrappers/app-storage
        valueFiles: 
          - $values/platform-products/infra-identity/applications/keycloak/components/storage/helm/values.yml
