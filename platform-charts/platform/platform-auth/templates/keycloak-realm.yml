{{- if .Values.platformAuth.keycloak.enabled }}
{{- $kind := .Values.platformAuth.keycloak.instance.scope }}

{{- if not (has $kind (list "namespace" "cluster")) }}
{{- fail "platformAuth.keycloak.instance.scope must be either 'namespace' or 'cluster'" }}
{{- end }}

{{- if eq $kind "namespace" }}
apiVersion: v1.edp.epam.com/v1alpha1
kind: KeycloakRealm 
metadata:
  name: {{ .Values.platformAuth.keycloak.realm.name | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "common.names.namespace" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  realmName: {{ .Values.platformAuth.keycloak.realm.name | quote }}
  keycloakRef:
    name: keycloak-endpoint
    kind: Keycloak
{{- end }}
{{- end }}
