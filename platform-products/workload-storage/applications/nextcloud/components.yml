# ===============================
# 
# ===============================
components:

  # ------------------
  # core
  # ------------------

    - name: core
      namespace: nextcloud
      namespaceLabels:
        shared-s3-creds: "true"

      enabled: true
      priority: 0

      syncPolicy:
        automated: false

      sources:

        # -- Helper -----
        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        # -- Application -----
        - type: helm
          repoURL: https://nextcloud.github.io/helm/
          targetRevision: 9.0.6
          chart: nextcloud
          valueFiles: 
            - $values/platform-products/workload-storage/applications/nextcloud/components/core/helm/values.yml

        # -- Secrets -----
        - type: kustomize 
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          path: platform-products/workload-storage/applications/nextcloud/components/core/kustomize

  # ------------------
  # exposure
  # ------------------

    - name: exposure
      namespace: nextcloud

      enabled: true
      priority: -5

      syncPolicy:
        automated: false

      sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        - type: helm 
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          path: platform-charts/wrappers/app-exposure
          valueFiles: 
            - $values/platform-products/workload-storage/applications/nextcloud/components/exposure/helm/values.yml

  # ------------------
  # storage
  # ------------------

    - name: storage
      namespace: nextcloud

      enabled: true
      priority: -5

      syncPolicy:
        automated: false

      sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        # -- Application -----
        - type: helm 
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          path: platform-charts/wrappers/app-storage
          valueFiles: 
            - $values/platform-products/workload-storage/applications/nextcloud/components/storage/helm/values.yml

  # ------------------
  # auth
  # ------------------

    - name: auth
      namespace: nextcloud

      enabled: true
      priority: -5

      syncPolicy:
        automated: false

      sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        - type: helm 
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          path: platform-charts/wrappers/app-auth
          valueFiles: 
            - $values/platform-products/workload-storage/applications/nextcloud/components/auth/helm/values.yml
