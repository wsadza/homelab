{{- if .Values.appStorage.blob.restoreHelper.enabled }}

{{- if not .Values.appStorage.blob.restoreHelper.restoreDate }}
{{- fail "appStorage.blob.restoreHelper.restoreDate is required when restoreHelper.enabled=true" }}
{{- end }}

{{- $fullname := include "common.names.fullname" . }}
{{- $restoreDate := .Values.appStorage.blob.restoreHelper.restoreDate }}
{{- $baseName := default $fullname .Values.appStorage.blob.restoreHelper.name }}

apiVersion: batch/v1
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-s3-restore-$s" $baseName $restoreDate | quote }}
  namespace: {{ default (include "common.names.namespace" .) .Values.appStorage.blob.backupHelper.namespace | quote }}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: rclone
          image: {{ .Values.appStorage.blob.restoreHelper.image | quote }}
          imagePullPolicy: IfNotPresent

          env:
            - name: SRC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appStorage.blob.restoreHelper.backupSourceSecrets.name | quote }}
                  key: {{ .Values.appStorage.blob.restoreHelper.backupSourceSecrets.keys.accessKey | quote }}
            - name: SRC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appStorage.blob.restoreHelper.backupSourceSecrets.name | quote }}
                  key: {{ .Values.appStorage.blob.restoreHelper.backupSourceSecrets.keys.secretKey | quote }}

            - name: DST_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appStorage.blob.restoreHelper.restoreTargetSecrets.name | quote }}
                  key: {{ .Values.appStorage.blob.restoreHelper.restoreTargetSecrets.keys.accessKey | quote }}
            - name: DST_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appStorage.blob.restoreHelper.restoreTargetSecrets.name | quote }}
                  key: {{ .Values.appStorage.blob.restoreHelper.restoreTargetSecrets.keys.secretKey | quote }}

            - name: SRC_ENDPOINT
              value: {{ .Values.appStorage.blob.restoreHelper.backupSourceEndpoint | quote }}
            - name: DST_ENDPOINT
              value: {{ .Values.appStorage.blob.restoreHelper.restoreTargetEndpoint | quote }}

            - name: SRC_BUCKET
              value: {{ .Values.appStorage.blob.restoreHelper.sourceBucket | quote }}
            - name: DST_BUCKET
              value: {{ .Values.appStorage.blob.restoreHelper.targetBucket | quote }}

            - name: RESTORE_DATE
              value: {{ $restoreDate | quote }}

            - name: DRY_RUN
              value: {{ .Values.appStorage.blob.restoreHelper.dryRun | quote }}
            - name: DELETE_EXTRANEOUS
              value: {{ .Values.appStorage.blob.restoreHelper.deleteExtraneous | quote }}

          command:
            - /bin/sh
            - -c
            - |
              set -eu

              mkdir -p /config/rclone

              cat > /config/rclone/rclone.conf <<EOF
              [src]
              type = s3
              provider = Other
              access_key_id = ${SRC_ACCESS_KEY}
              secret_access_key = ${SRC_SECRET_KEY}
              endpoint = ${SRC_ENDPOINT}
              acl = private
              force_path_style = true

              [dst]
              type = s3
              provider = Other
              access_key_id = ${DST_ACCESS_KEY}
              secret_access_key = ${DST_SECRET_KEY}
              endpoint = ${DST_ENDPOINT}
              acl = private
              force_path_style = true
              EOF

              echo "Preparing restore from ${SRC_BUCKET}/${RESTORE_DATE} to ${DST_BUCKET}"

              RCLONE_FLAGS="
                --s3-no-check-bucket
                --checksum
                --fast-list
                --transfers 8
                --checkers 16
                --log-level INFO
              "

              if [ "${DRY_RUN}" = "true" ]; then
                RCLONE_FLAGS="${RCLONE_FLAGS} --dry-run"
                echo "Running restore in DRY-RUN mode"
              fi

              if [ "${DELETE_EXTRANEOUS}" = "true" ]; then
                echo "Using rclone sync: files missing from backup may be deleted from target"
                rclone sync \
                  src:${SRC_BUCKET}/${RESTORE_DATE} \
                  dst:${DST_BUCKET} \
                  ${RCLONE_FLAGS}
              else
                echo "Using rclone copy: existing extra files on target will be preserved"
                rclone copy \
                  src:${SRC_BUCKET}/${RESTORE_DATE} \
                  dst:${DST_BUCKET} \
                  ${RCLONE_FLAGS}
              fi

              echo "Restore job complete"
{{- end }}
