# ===============================
#
# ===============================
applications:

  # ---------------------------------------------
  # Keycloak Operator 
  # ---------------------------------------------

    - name: keycloak-operator
      enabled: true

      namespace:
        name: keycloak 
        autocreate: "true"

      syncPolicy:
        automated: true

  # ---------------------------------------------
  # Keycloak Instance 
  # ---------------------------------------------

    - name: keycloak
      enabled: true

      namespace:
        name: keycloak 
        autocreate: "true"

      syncPolicy:
        automated: false

  # ---------------------------------------------
  # EDP Keycloak Operator
  # ---------------------------------------------

    - name: edp-keycloak-operator 
      enabled: true 

      namespace: 
        name: keycloak 
        autocreate: "true"

      syncPolicy:
        automated: true

  # ---------------------------------------------
  # OpenLDAP
  # ---------------------------------------------

    - name: openldap 
      enabled: true 

      namespace: 
        name: openldap 
        autocreate: "true"

      syncPolicy:
        automated: true

  # ---------------------------------------------
  # Platform Identity Configurations
  # ---------------------------------------------

    - name: platform-identity
      enabled: true

      namespace: 
        name: keycloak 
        autocreate: "true"

      syncPolicy:
        automated: true
