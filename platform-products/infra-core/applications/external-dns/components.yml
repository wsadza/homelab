components:

  # ------------------
  # core
  # ------------------
  
  - name: core

    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        targetRevision: 1.20.0
        chart: external-dns
        valueFiles: 
          - $values/platform-products/infra-core/applications/external-dns/components/core/helm/values.yml

      - type: kustomize 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-core/applications/external-dns/components/core/kustomize
