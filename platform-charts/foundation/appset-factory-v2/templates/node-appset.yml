{{- if eq .Values.mode "node" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.node.name }}
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: {{ .Values.repoURL | quote }}
        revision: {{ .Values.targetRevision | quote }}
        requeueAfterSeconds: 30
        files:
          - path: {{ .Values.node.file | quote }}
  template:
    metadata:
      name: {{ .Values.node.name | quote }}
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
{{- end }}
