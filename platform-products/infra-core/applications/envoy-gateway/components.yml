# ===============================
# 
# ===============================
components:

  # ------------------
  # crds
  # ------------------

  - name: crds
    priority: -10

    syncPolicy:
      automated: true
      syncOptions:
        - ServerSideApply=true

    sources:

      # -- Helper ------
      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      # -- Release ------
      - type: helm
        repoURL: oci://docker.io/envoyproxy/gateway-crds-helm
        targetRevision: v1.7.1
        chart: envoy-gateway-crds
        valueFiles: 
          - $values/platform-products/infra-core/applications/envoy-gateway/components/crds/helm/values.yml

  # ------------------
  # core
  # ------------------

  - name: core 
    priority: -5

    sources:

      # -- Helper ------
      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      # -- Release ------
      - type: helm
        repoURL: oci://docker.io/envoyproxy/gateway-helm
        targetRevision: v1.7.1
        chart: envoy-gateway-crds
        skipCrds: true
        valueFiles: 
          - $values/platform-products/infra-core/applications/envoy-gateway/components/core/helm/values.yml
      
      # -- Extras ------
      - type: manifests
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-core/applications/envoy-gateway/components/core/manifests
