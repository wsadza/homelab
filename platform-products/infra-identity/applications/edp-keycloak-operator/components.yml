# ===============================
# 
# ===============================
components:

  # ------------------
  # core
  # ------------------
  
  - name: core
    namespace: keycloak

    enabled: true
    priority: -5

    syncPolicy:
      automated: false

    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      # Instance
      - type: helm 
        repoURL: https://epam.github.io/edp-helm-charts/stable 
        targetRevision: 1.31.0
        chart: keycloak-operator
        valueFiles: 
          - $values/platform-products/infra-identity/applications/edp-keycloak-operator/components/core/helm/values.yml

      # Secrets
      - type: kustomize 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-identity/applications/edp-keycloak-operator/components/app/kustomize
