#apiVersion: seaweed.seaweedfs.com/v1
#kind: Bucket
#metadata:
#  name: nextcloud-managed
#  namespace: seaweedfs
#spec:
#  clusterRef:
#    name: seaweed
#    namespace: seaweedfs
#  reclaimPolicy: Delete
#  versioning: Enabled
#  quota:
#    size: 10Gi
#  owner: admin
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClass
metadata:
  name: seaweedfs
driverName: seaweedfs.objectstorage.k8s.io
deletionPolicy: Retain
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: app-bucket
  namespace: seaweedfs
spec:
  bucketClassName: seaweedfs
  existingBucketName: nextcloud-managed
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: Bucket
metadata:
  name: nextcloud-managed
spec:
  bucketClaim:
    name: app-bucket
    namespace: seaweedfs
  bucketClassName: seaweedfs
  deletionPolicy: Retain
  driverName: seaweedfs.objectstorage.k8s.io
  existingBucketID: nextcloud-managed
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccessClass
metadata:
  name: seaweedfs-key
driverName: seaweedfs.objectstorage.k8s.io
authenticationType: KEY
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: app-bucket-access
  namespace: seaweedfs
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: app-bucket
  credentialsSecretName: app-bucket-secret
  protocol: S3
