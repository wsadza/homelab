{{- if eq .Values.mode "node" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.node.name }}
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: {{ .Values.repoURL | quote }}
        revision: {{ .Values.targetRevision | quote }}
        requeueAfterSeconds: 30
        files:
          - path: {{ .Values.node.file | quote }}
    - list:
        elementsYaml: |
          {{ `{{- $items := list }}` }}
          {{ `{{- range .` }}{{ .Values.node.listKey }}{{ ` }}` }}
          {{ `{{- $items = append $items . }}` }}
          {{ `{{- end }}` }}
          {{ `{{ $items | toYaml }}` }}

  template:
    metadata:
      name: '{{ `{{ .name }}` }}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd

  templatePatch: |
    spec:
      sources:
        {{ `{{- range .` }}{{ .Values.node.listKey }}{{ ` }}` }}
        - repoURL: {{ $.Values.repoURL | quote }}
          targetRevision: {{ $.Values.targetRevision | quote }}
          path: {{ $.Values.node.childChartPath | quote }}
        {{ `{{- end }}` }}
{{- end }}
