# ===============================
# 
# ===============================
components:

  # ------------------
  # app-crds
  # ------------------

  - name: app-crds
    namespace: envoy-gateway-system

    enabled: true
    priority: -10

    syncPolicy:
      automated: true
      syncOptions:
        - ServerSideApply=true

    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm
        repoURL: oci://docker.io/envoyproxy/gateway-crds-helm
        targetRevision: v1.7.1
        chart: envoy-gateway-crds
        valueFiles: 
          - $values/platform-products/infra-core/applications/envoy-gateway/components/app-crds/helm/values.yml

  # ------------------
  # app
  # ------------------

  - name: app 
    namespace: envoy-gateway-system

    enabled: true
    priority: -5

    syncPolicy:
      automated: false
      syncOptions:
        - ServerSideApply=true

    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm
        repoURL: oci://docker.io/envoyproxy/gateway-helm
        targetRevision: v1.7.1
        chart: envoy-gateway-crds
        valueFiles: 
          - $values/platform-products/infra-core/applications/envoy-gateway/components/app/helm/values.yml
      
      - type: manifests
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-core/applications/envoy-gateway/components/app/manifests
