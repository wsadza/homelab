{{- if and .Values.appAuth.keycloak.enabled .Values.appAuth.keycloak.client.enabled .Values.appAuth.keycloak.client.clientSecret.generate }}
{{- $baseName := default (printf "%s-keycloak-client-secret" (include "common.names.fullname" .)) .Values.appAuth.keycloak.client.clientSecret.name }}
{{- $generatorName := default (printf "%s-secret-generator" (include "common.names.fullname" .)) .Values.appAuth.keycloak.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $baseName }}
  namespace: {{ default (include "common.names.namespace" .) .Values.appAuth.keycloak.namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $baseName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        {{ .Values.appAuth.keycloak.client.clientSecret.key }}: '{{ `{{ .password }}` }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $generatorName }}
{{- end }}
