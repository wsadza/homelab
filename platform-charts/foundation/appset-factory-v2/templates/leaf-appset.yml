{{- if eq .Values.mode "leaf" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.leaf.name }}
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          - git:
              repoURL: {{ .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | quote }}
              requeueAfterSeconds: 30
              files:
                - path: {{ .Values.leaf.file | quote }}

          - list:
              elementsYaml: |
                {{ `{{- $items := list }}` }}
                {{ `{{- $nodeNamespace := ` }}{{ .Values.leaf.namespace | default dict | toJson | quote }}{{ ` | fromJson }}` }}
                {{ `{{- range .` }}{{ .Values.leaf.listKey }}{{ ` }}` }}
                {{ `{{- if (dig "enabled" true .) }}` }}
                {{ `{{- if not (hasKey . "namespace") }}` }}
                {{ `{{- if not (get . "namespace") }}` }}
                {{ `{{- $_ := set . "namespace" $nodeNamespace }}` }}
                {{ `{{- end }}` }}
                {{ `{{- end }}` }}
                {{ `{{- $items = append $items . }}` }}
                {{ `{{- end }}` }}
                {{ `{{- end }}` }}
                {{ `{{ $items | toYaml }}` }}

  template:
    metadata:
      name: "{{ .Values.leaf.application }}-{{ `{{ .name }}` }}"
    spec:
      project: default 
      destination:
        server: https://kubernetes.default.svc
        namespace: default

  templatePatch: |
    {{ `{{- $namespace := get . "namespace" }}` }}
    {{ `{{- $namespaceName := .name }}` }}
    {{ `{{- $namespaceLabels := dict }}` }}
    {{ `{{- $namespaceAutocreate := true }}` }}

    {{ `{{- if kindIs "map" $namespace }}` }}
      {{ `{{- $namespaceName = get $namespace "name" | default .name }}` }}
      {{ `{{- $namespaceLabels = get $namespace "labels" | default dict }}` }}
      {{ `{{- $namespaceAutocreate = get $namespace "autocreate" | default true }}` }}
    {{ `{{- else if $namespace }}` }}
      {{ `{{- $namespaceName = $namespace }}` }}
    {{ `{{- end }}` }}

    metadata:
      annotations:
        {{ `{{- if hasKey . "priority" }}` }}
        argocd.argoproj.io/sync-wave: "{{ `{{ .priority }}` }}"
        {{ `{{- end }}` }}
      labels:
        application: {{ .Values.leaf.application | quote }}
        product: {{ .Values.leaf.product | quote }}

    spec:
      syncPolicy:
        {{ `{{- if eq (toString (dig "syncPolicy" "automated" "false" .)) "true" }}` }}
        automated:
          prune: true
          selfHeal: true
        {{ `{{- end }}` }}

        {{ `{{- with $namespaceLabels }}` }}
        managedNamespaceMetadata:
          labels:
            {{ `{{- range $key, $value := . }}` }}
            {{ `{{ $key }}: {{ $value | toString | quote }}` }}
            {{ `{{- end }}` }}
        {{ `{{- end }}` }}

        syncOptions:
          - CreateNamespace=true
          {{ `{{- range (dig "syncPolicy" "syncOptions" (list) .) }}` }}
          - {{ `{{ . }}` }}
          {{ `{{- end }}` }}


      sources:
        {{ `{{ $root := . }}` }}
        {{ `{{- range .sources }}` }}

        {{ `{{- if eq .type "values"}}` }}
        - repoURL: {{ `{{ .repoURL | quote }}` }}
          targetRevision: {{ `{{ .targetRevision | quote }}` }}
          ref:  {{ `{{ .ref }}` }}

        {{ `{{- else if eq .type "helm"}}` }}
        - repoURL: {{ `{{ .repoURL | quote }}` }}
          targetRevision: {{ `{{ .targetRevision | quote }}` }}

          {{ `{{- if hasKey . "chart" }}` }}
          chart:  {{ `{{ .chart | quote }}` }}
          {{ `{{- end }}` }}

          {{ `{{- if hasKey . "path" }}` }}
          path: {{ `{{ .path | quote }}` }}
          {{ `{{- end }}` }}

          helm:
            {{ `{{- if hasKey . "valueFiles" }}` }}
            {{ `{{- with .valueFiles }}` }}
            valueFiles:
            {{ `{{- range . }}` }}
            - {{ `{{ . | quote }}` }}
            {{ `{{- end }}` }}
            {{ `{{- end }}` }}
            {{ `{{- end }}` }}

            {{ `{{- if hasKey $root "releaseName" }}` }}
            releaseName: {{ `{{ $root.releaseName | quote }}` }}
            {{ `{{- else }}` }}
            releaseName: {{ .Values.leaf.application | quote }}
            {{ `{{- end }}` }}

            {{ `{{- if hasKey . "skipCrds" }}` }}
            skipCrds: {{ `{{ .skipCrds }}` }}
            {{ `{{- end }}` }}

        {{ `{{- else if eq .type "manifests"}}` }}
        - repoURL: {{ `{{ .repoURL | quote }}` }}
          targetRevision: {{ `{{ .targetRevision | quote }}` }}
          path: {{ `{{ .path | quote }}` }}
        {{ `{{- if hasKey . "recurse" }}` }}
          directory:
            recurse: {{ `{{ .recurse | default false }}` }}
        {{ `{{- end }}` }}
        {{ `{{- if hasKey . "include" }}` }}
          directory:
            include: {{ `{{ .include | quote }}` }}
        {{ `{{- end }}` }}
          
        {{ `{{- else if eq .type "kustomize"}}` }}
        - repoURL: {{ `{{ .repoURL | quote }}` }}
          targetRevision: {{ `{{ .targetRevision | quote }}` }}
          path: {{ `{{ .path | quote }}` }}
        {{ `{{- end }}` }}
          
        {{ `{{- end }}` }}

        {{- end }}
