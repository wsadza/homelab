# ===============================
components:

  # ------------------
  # core 
  # ------------------

    - name: core 
    #namespace:
    #    name: "DUPA"
    #    autocreate: "true"

      enabled: true
      priority: 0

      #  syncPolicy:
      #  automated: false

      sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        - type: helm
          repoURL: https://stefanprodan.github.io/podinfo
          targetRevision: 6.9.1
          chart: podinfo 
          valueFiles: 
            - $values/platform-products/workload-tests/applications/podinfo/components/core/helm/values.yml

  # ------------------
  # exposure
  # ------------------

    - name: exposure
      #namespace: podinfo

      enabled: true
      priority: 0

      syncPolicy:
        automated: false

      sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        - type: helm 
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          path: platform-charts/wrappers/app-exposure
          valueFiles: 
            - $values/platform-products/workload-tests/applications/podinfo/components/exposure/helm/values.yml

  # ------------------
  # security
  # ------------------

    - name: security
      #namespace: podinfo

      enabled: false
      priority: 0

      syncPolicy:
        automated: false

      sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        - type: helm 
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          path: platform-charts/wrappers/app-security
          valueFiles: 
            - $values/platform-products/workload-tests/applications/podinfo/components/security/helm/values.yml

  # ------------------
  # auth
  # ------------------

    - name: auth
      #namespace: podinfo

      enabled: true
      priority: 0

      syncPolicy:
        automated: false

      sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        - type: helm 
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          path: platform-charts/wrappers/app-auth
          valueFiles: 
            - $values/platform-products/workload-tests/applications/podinfo/components/auth/helm/values.yml
