components:

  # ------------------
  # app
  # ------------------

  - name: app 
    namespace: cert-manager 

    enabled: true
    priority: -5

    syncPolicy:
      automated: true

    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm
        repoURL: https://charts.jetstack.io
        targetRevision: 1.20.2 
        chart: cert-manager 
        valueFiles: 
          - $values/platform-products/platform-core/applications/cert-manager/components/app/helm/values.yml

