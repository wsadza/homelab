# ===============================
# 
# ===============================
components:

  # ------------------
  # core
  # ------------------

  - name: core
    priority: -5
    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-charts/applications/openldap
        valueFiles: 
          - $values/platform-products/infra-identity/applications/openldap/components/core/helm/values.yml

      - type: kustomize 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-products/infra-identity/applications/openldap/components/core/kustomize

  # ------------------
  # exposure
  # ------------------

  - name: exposure
    priority: 0
    sources:

      - type: values
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        ref: values

      - type: helm 
        repoURL: https://github.com/wsadza/homelab.git
        targetRevision: HEAD
        path: platform-charts/wrappers/app-exposure
        valueFiles: 
          - $values/platform-products/infra-identity/applications/openldap/components/exposure/helm/values.yml
