# -----------------------------------------------
# @section common parameters
# -----------------------------------------------
#
# @param nameOverride      : String to partially override common.names.name
# @param fullnameOverride  : String to fully override common.names.fullname
# @param namespaceOverride : String to fully override common.names.namespace
# @param commonLabels      : Labels to add to all deployed objects
# @param commonAnnotations : Annotations to add to all deployed objects
#
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}

# -----------------------------------------------
# @section appExposure parameters
# -----------------------------------------------
#
appExposure:

  # ===============================================
  # @section Gateway API parameters
  # ===============================================

  gatewayApi:
    # @param appExposure.gatewayApi.enabled Enable Gateway API resources.
    enabled: true

    # @param appExposure.gatewayApi.gateway.enabled          : Enable Gateway resource generation.
    # @param appExposure.gatewayApi.gateway.name             : Gateway resource name.
    # @param appExposure.gatewayApi.gateway.namespace        : Namespace where the Gateway will be created.
    # @param appExposure.gatewayApi.gateway.labels           : Labels to add to the Gateway.
    # @param appExposure.gatewayApi.gateway.annotations      : Annotations to add to the Gateway.
    # @param appExposure.gatewayApi.gateway.gatewayClassName : GatewayClass name used by the Gateway.
    # @param appExposure.gatewayApi.gateway.listeners        : List of Gateway listeners. 
    gateway:
      enabled: true
      name: gateway-keycloak
      namespace: envoy-gateway-system
      annotations:
        external-dns.alpha.kubernetes.io/target: anykey.pl
      gatewayClassName: envoy

      # @param appExposure.gatewayApi.gateway.listeners[0].name          : Listener name.
      # @param appExposure.gatewayApi.gateway.listeners[0].protocol      : Listener protocol.
      # @param appExposure.gatewayApi.gateway.listeners[0].port          : Listener port.
      # @param appExposure.gatewayApi.gateway.listeners[0].hostname      : Hostname accepted by the listener.
      # @param appExposure.gatewayApi.gateway.listeners[0].allowedRoutes : Allowed routes configuration.
      listeners:
        - name: listener-http
          protocol: HTTP
          port: 80
          hostname: keycloak.anykey.pl 
          allowedRoutes:
            namespaces:
              from: All

        - name: listener-https
          protocol: HTTPS
          port: 443
          hostname: keycloak.anykey.pl 
          tls:
            mode: Terminate
            certificateRefs:
              - name: keycloak-app-exposure-tls-certificate 
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  kubernetes.io/metadata.name: keycloak 

    # -----------------------------------------------
    # @subsection HTTPRoutes parameters
    # -----------------------------------------------
    #
    # @param appExposure.gatewayApi.httpRoute.enabled     : Enable HTTPRoute resource generation.
    # @param appExposure.gatewayApi.httpRoute.name        : HTTPRoute resource name.
    # @param appExposure.gatewayApi.httpRoute.namespace   : Namespace where the HTTPRoute will be created.
    # @param appExposure.gatewayApi.httpRoute.labels      : Labels to add to the HTTPRoute.
    # @param appExposure.gatewayApi.httpRoute.annotations : Annotations to add to the HTTPRoute.
    # @param appExposure.gatewayApi.httpRoute.parentRefs  : Parent Gateway references.
    # @param appExposure.gatewayApi.httpRoute.hostnames   : Hostnames matched by the HTTPRoute.
    # @param appExposure.gatewayApi.httpRoute.rules       : HTTPRoute routing rules.
    httpRoutes:
      - enabled: true
        name: keycloak-https-route
        namespace: keycloak 
        parentRefs:
          - name: gateway-keycloak
            namespace: envoy-gateway-system 
            sectionName: listener-https
        hostnames:
          - keycloak.anykey.pl
        rules:
          - backendRefs:
              - kind: Service
                name: keycloak-app-service
                namespace: keycloak
                port: 8080

      - enabled: true
        name: acme-http-route
        namespace: keycloak 
        parentRefs:
          - name: gateway-keycloak
            namespace: envoy-gateway-system
            sectionName: listener-http
        hostnames:
          - keycloak.anykey.pl
        rules:
           - matches:
              - path:
                  type: PathPrefix
                  value: /.well-known/acme-challenge/
             backendRefs: []

      - enabled: true
        name: keycloak-http-redirect
        namespace: keycloak 
        parentRefs:
          - name: gateway-keycloak
            namespace: envoy-gateway-system
            sectionName: listener-http
        hostnames:
          - keycloak.anykey.pl
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
                  port: 443

  # ===============================================
  # @section Certificate parameters
  # ===============================================
  
  # @param appExposure.certificate.enabled            : Enable Certificate resource generation.
  # @param appExposure.certificate.name               : Certificate resource name.
  # @param appExposure.certificate.namespace          : Namespace where the Certificate will be created.
  # @param appExposure.certificate.existingIssuer     : Name of an existing Issuer or ClusterIssuer.
  # @param appExposure.certificate.existingIssuerKind : Kind of the existing issuer. Usually Issuer or ClusterIssuer.
  # @param appExposure.certificate.keySize            : Private key size.
  # @param appExposure.certificate.keyAlgorithm       : Private key algorithm.
  # @param appExposure.certificate.duration           : Certificate validity duration.
  # @param appExposure.certificate.renewBefore        : How long before expiry cert-manager should renew the certificate.
  # @param appExposure.certificate.secretName         : Secret name where the TLS certificate will be stored.
  # @param appExposure.certificate.dnsNames           : DNS names covered by the certificate. 
  certificate:
    enabled: true
    namespace: envoy-gateway-system
    dnsNames:
      - keycloak.anykey.pl

    # -----------------------------------------------
    # @subsection Issuer parameters
    # -----------------------------------------------
    #
    # @param appExposure.certificate.issuer.enabled                          : Enable Issuer resource generation.
    # @param appExposure.certificate.issuer.name                             : Issuer resource name.
    # @param appExposure.certificate.issuer.namespace                        : Namespace where the Issuer will be created.
    # @param appExposure.certificate.issuer.acme.email                       : ACME registration email.
    # @param appExposure.certificate.issuer.acme.server                      : ACME server URL.
    # @param appExposure.certificate.issuer.acme.privateKeySecretName        : Secret name used to store the ACME account private key.
    # @param appExposure.certificate.issuer.acme.gatewayHTTPRoute.parentRefs : Gateway parent references used for HTTP-01 challenges. 
    issuer:
      enabled: true
      namespace: envoy-gateway-system 
      acme:
        gatewayHTTPRoute:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: gateway-keycloak
              namespace: envoy-gateway-system 
