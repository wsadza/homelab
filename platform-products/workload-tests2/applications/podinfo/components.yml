components:

  # ------------------
  # application
  # ------------------

    - name: app
      namespace: podinfo

      enabled: true
      priority: 0

      syncPolicy:
        automated: false

      sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        - type: helm
          repoURL: https://stefanprodan.github.io/podinfo
          targetRevision: 6.9.1
          chart: podinfo 
          valueFiles: 
            - $values/platform-products/workload-tests2/applications/podinfo/components/app/helm/values.yml

  # ------------------
  # storage 
  # ------------------

    - name: app-storage
      namespace: podinfo

      enabled: true
      priority: 0

