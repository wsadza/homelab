{{- if eq .Values.mode "node" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.node.name }}
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: {{ .Values.repoURL | quote }}
        revision: {{ .Values.targetRevision | quote }}
        requeueAfterSeconds: 30
        files:
          - path: {{ .Values.node.file | quote }}
    #- list:
    #    elementsYaml: |
    #      {{ `{{- $items := list }}` }}
    #      {{ `{{- range .` }}{{ .Values.node.listKey }}{{ ` }}` }}
    #      {{ `{{- if (dig "enabled" true .) }}` }}
    #      {{ `{{- $items = append $items . }}` }}
    #      {{ `{{- end }}` }}
    #      {{ `{{- end }}` }}
    #      {{ `{{ $items | toYaml }}` }}

  template:
    metadata:
      name: {{ .Values.node.name | quote }}
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd

  templatePatch: |
    spec:
      sources:
        {{ `{{- range .` }}{{ .Values.node.listKey }}{{ ` }}` }}
        - repoURL: {{ $.Values.repoURL | quote }}
          targetRevision: {{ $.Values.targetRevision | quote }}
          path: {{ $.Values.node.childChartPath | quote }}
          helm:
            values: |
              mode: {{ $.Values.node.childMode | quote }}
              repoURL: {{ $.Values.repoURL | quote }}
              targetRevision: {{ $.Values.targetRevision | quote }}

              leaf:
                name: {{ $.Values.node.childNameTemplate | replace "{{ product }}" $.Values.node.product | replace "{{ application }}" "{{ .name }}" | quote }}
                file: {{ $.Values.node.childFileTemplate | replace "{{ product }}" $.Values.node.product | replace "{{ application }}" "{{ .name }}" | quote }}
                product: {{ $.Values.node.product | quote }}
                application: {{ `{{ .name }}` | quote }}
                listKey: {{ $.Values.leaf.listKey | quote }}
        {{ `{{- end }}` }}
{{- end }}
