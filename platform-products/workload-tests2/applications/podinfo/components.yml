        - type: helm
          repoURL: https://stefanprodan.github.io/podinfo
          targetRevision: 6.9.1
          chart: podinfo 
          valueFiles: 
            - $values/platform-products/workload-tests2/applications/podinfo/components/app-storage/helm/values.yml

  # ------------------
