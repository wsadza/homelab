components:

  # ------------------
  # app
  # ------------------
  
  - name: app 
    namespace: seaweedfs 

    enabled: true
    priority: 0 

    syncPolicy:
      automated: false

    sources:

        - type: values
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          ref: values

        - type: helm
          repoURL: https://seaweedfs.github.io/seaweedfs/helm 
          targetRevision: 4.23.0
          chart: seaweedfs
          valueFiles: 
            - $values/platform-products/platform-storage/applications/seaweedfs/components/app/helm/values.yml

        - type: kustomize 
          repoURL: https://github.com/wsadza/homelab.git
          targetRevision: HEAD
          path: platform-products/platform-storage/applications/seaweedfs/components/app/kustomize
