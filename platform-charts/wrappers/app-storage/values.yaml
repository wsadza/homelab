#
# : AppStorage (wrapper)
# -----------------------------------------------
#
# Author:  Igor Sadza
# Purpose: Helm chart values for app storage resources: S3 blob storage and CNPG PostgreSQL
#
# ===============================================

# -----------------------------------------------
# @section appStorage parameters
# -----------------------------------------------

appStorage:
  
  # ===============================================
  # @section blob parameters
  # ===============================================
  #
  blob:
    enabled: false

    # ===============================================
    # Basic Configuration parameters 
    # ===============================================
    #
    # @param appStorage.blob.enabled               : Enable S3 blob storage resources
    # @param appStorage.blob.name                  : Override bucket name; defaults to <fullname>-bucket
    # @param appStorage.blob.namespace             : Override bucket namespace; defaults to common.names.namespace
    # @param appStorage.blob.credentialsSecretName : Override credentials Secret name; defaults to <fullname>-object-store-secret
    # @param appStorage.blob.bucketClassName       : COSI BucketClass name used by Bucket and BucketClaim
    # @param appStorage.blob.bucketAccessClassName : COSI BucketAccessClass name used by BucketAccess
    # @param appStorage.blob.driverName            : COSI object storage driver name
    # @param appStorage.blob.clusterRef.name       : SeaweedFS cluster name referenced by the bucket
    # @param appStorage.blob.clusterRef.namespace  : SeaweedFS cluster namespace referenced by the bucket
    # @param appStorage.blob.reclaimPolicy         : SeaweedFS bucket reclaim policy
    # @param appStorage.blob.deletionPolicy        : COSI bucket deletion policy
    # @param appStorage.blob.versioning            : Bucket versioning mode
    # @param appStorage.blob.quota.size            : Bucket quota size
    # @param appStorage.blob.owner                 : Bucket owner user
    # @param appStorage.blob.access                : List of bucket access rules
    # @param appStorage.blob.access[].user         : User granted access to the bucket
    # @param appStorage.blob.access[].actions      : List of allowed bucket actions for the user
    #
    name: ""
    namespace: ""
    credentialsSecretName: ""

    bucketClassName: seaweedfs
    bucketAccessClassName: seaweedfs
    driverName: seaweedfs.objectstorage.k8s.io

    clusterRef:
      name: seaweed
      namespace: seaweedfs

    reclaimPolicy: Retain 
    deletionPolicy: Retain
    versioning: Enabled

    quota:
      size: 10Gi

    owner: admin
    access:
      - user: admin
        actions:
          - Read
          - Write
          - List

    # ===============================================
    # @subsection secretHelper parameters
    # ===============================================
    #
    secretHelper:
      enabled: false

      name: ""

      serviceAccount:
        name: ""
        namespace: ""

      role:
        name: ""
        namespace: ""
        rules:
          - apiGroups: [""]
            resources: ["secrets"]
            verbs:     ["get","list","watch"]

          - apiGroups: ["authorization.k8s.io"]
            resources: ["selfsubjectrulesreviews"]
            verbs:     ["create"]

      externalSecret:
        apiVersion: external-secrets.io/v1
        refreshInterval: 1m

        secretStoreRef:
          kind: SecretStore
          name: ""

        target:
          name: ""
          creationPolicy: Owner
          template:
            engineVersion: v2
            type: Opaque
            data:
              S3_BUCKET:     '{{ $b := .bucketInfo | fromJson }}{{ index $b "spec" "bucketName" }}'
              S3_ENDPOINT:   '{{ $b := .bucketInfo | fromJson }}{{ index $b "spec" "secretS3" "endpoint" }}'
              S3_REGION:     '{{ $b := .bucketInfo | fromJson }}{{ index $b "spec" "secretS3" "region" }}'
              S3_ACCESS_KEY: '{{ $b := .bucketInfo | fromJson }}{{ index $b "spec" "secretS3" "accessKeyID" }}'
              S3_SECRET_KEY: '{{ $b := .bucketInfo | fromJson }}{{ index $b "spec" "secretS3" "accessSecretKey" }}'

        data:
          secretKey: bucketInfo
          remoteRef:
            key: ""
            property: BucketInfo

    # ===============================================
    # @subsection backupHelper parameters
    # ===============================================
    #
    backupHelper:
      enabled: true
      name: seaweedfs-s3-backup
      namespace: "" 
      schedule: "0 2 * * *"
    
      sourceBucket: nextcloud
      targetBucket: nextcloud/objects
    
      backupSourceEndpoint: "http://seaweed-filer.seaweedfs.svc.cluster.local:8333"
      backupSourceSecrets:
        name: nextcloud-object-store-secret
        keys:
          sourceKey: S3_ACCESS_KEY
          secretKey: S3_SECRET_KEY
    
      backupTargetEndpoint: "http://192.168.1.10:8333"
      backupTargetSecrets:
        name: seaweedfs-backup-secrets
        keys:
          sourceKey: S3_ACCESS_KEY
          secretKey: S3_SECRET_KEY

    # ===============================================
    # @subsection backupHelper parameters
    # ===============================================
    #
    restoreHelper:
      enabled: true 
    
      name: seaweedfs-s3-restore
      namespace: seaweedfs
    
      image: rclone/rclone:latest
    
      # Which backup folder to restore from.
      # This should match the DATE used during backup, for example: 2026-05-26
      restoreDate: "2026-05-14"
    
      # Buckets
      sourceBucket: backup
      targetBucket: nextcloud-bucket
    
      # Backup storage endpoint — where the backup lives
      backupSourceEndpoint: "http://192.168.1.10:8333"
      backupSourceSecrets:
        name: seaweedfs-backup-secrets
        keys:
          sourceKey: S3_ACCESS_KEY
          secretKey: S3_SECRET_KEY
    
      # Live SeaweedFS endpoint — where data should be restored
      restoreTargetEndpoint: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
      restoreTargetSecrets:
        name: seaweedfs-backup-secrets
        keys:
          sourceKey: S3_ACCESS_KEY
          secretKey: S3_SECRET_KEY
    
      # Safety options
      dryRun: true
      deleteExtraneous: false

  # ===============================================
  # @section psql parameters
  # ===============================================
  #
  # @param appStorage.psql.enabled   : Enable CNPG PostgreSQL resources
  # @param appStorage.psql.name      : Override CNPG Cluster name; defaults to <fullname>-cnpg-cluster
  # @param appStorage.psql.namespace : Override CNPG Cluster namespace; defaults to common.names.namespace
  #
  psql:
    enabled: false

    name: ""
    namespace: "" 

    # ===============================================
    # Basic Configuration parameters 
    # ===============================================
    #
    # @param appStorage.psql.instances                   : Number of PostgreSQL instances managed by CNPG
    # @param appStorage.psql.image                       : PostgreSQL container image used by CNPG
    # @param appStorage.psql.storage.size                : Persistent volume size for PostgreSQL data
    # @param appStorage.psql.storage.storageClass        : StorageClass used for PostgreSQL persistent volume claims
    # @param appStorage.psql.monitoring.enablePodMonitor : Enable PodMonitor creation/integration for PostgreSQL metrics
    #
    instances: 1
    image: ghcr.io/cloudnative-pg/postgresql:16

    storage:
      size: 10Gi
      storageClass: storage-local-retain

    monitoring:
      enablePodMonitor: false

    # ===============================================
    # @subsection bootstrap parameters
    # ===============================================
    #
    # @param appStorage.psql.bootstrap.mode               : Bootstrap mode for the cluster; allowed values are initdb or recovery
    # @param appStorage.psql.bootstrap.initdb.database    : Initial database name; defaults to <fullname>
    # @param appStorage.psql.bootstrap.initdb.owner       : Initial database owner; defaults to <fullname>
    # @param appStorage.psql.bootstrap.initdb.secret.name : Secret containing database owner credentials; defaults to <fullname>-database-secret
    # @param appStorage.psql.bootstrap.recovery.source    : External cluster source name used when bootstrap.mode is recovery
    #
    bootstrap:
      mode: initdb

      initdb:
        database: ""
        owner:  ""
        secret:
          name:  ""

      recovery:
        source: origin

    # ===============================================
    # @subsection backup parameters
    # ===============================================
    #
    # @param appStorage.psql.backup.generation : Active backup/WAL archive generation name; used to compute serverName when not overridden
    # @param appStorage.psql.backup.serverName : Override active backup/WAL archive serverName; defaults to <fullname>-<generation>
    #
    backup:
      generation: initial
      serverName: ""

    # ===============================================
    # @subsection recovery parameters
    # ===============================================
    #
    # @param appStorage.psql.recovery.sourceGeneration : Source backup/WAL archive generation used for recovery
    # @param appStorage.psql.recovery.sourceServerName : Override recovery source serverName; defaults to <fullname>-<sourceGeneration>
    #
    recovery:
      sourceGeneration: initial
      sourceServerName: ""

    # ===============================================
    # @subsection externalSources parameters
    # ===============================================
    #
    # @param appStorage.psql.externalClusters                                      : List of external CNPG clusters used as recovery sources
    # @param appStorage.psql.externalClusters[].name                               : External cluster name referenced by bootstrap.recovery.source
    # @param appStorage.psql.externalClusters[].plugin.name                        : CNPG plugin name used to access the external backup source
    # @param appStorage.psql.externalClusters[].plugin.parameters.barmanObjectName : ObjectStore name used by the external recovery source; defaults to <fullname>-object-store
    #
    externalClusters: 
      - name: origin
        plugin:
          name: barman-cloud.cloudnative-pg.io
          parameters:
            barmanObjectName: ""
            serverName: ""
   
    # ===============================================
    # @subsection plugins parameters
    # ===============================================
    #
    # @param appStorage.psql.plugins                               : List of CNPG plugins configured for the cluster
    # @param appStorage.psql.plugins[].name                        : CNPG plugin name
    # @param appStorage.psql.plugins[].isWALArchiver               : Mark plugin as the WAL archiver for this cluster
    # @param appStorage.psql.plugins[].parameters.barmanObjectName : ObjectStore name used for WAL archiving/backups; defaults to <fullname>-object-store
    #
    plugins:
      - name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: ""
          serverName: ""

    # ===============================================
    # @subsection objectStore parameters
    # ===============================================
    #
    # @param appStorage.psql.objectStore.enabled                       : Enable Barman ObjectStore resource
    # @param appStorage.psql.backupSchedule.name                       : Override ScheduledBackup name; defaults to <fullname>-scheduled-backup
    # @param appStorage.psql.objectStore.name                          : Override ObjectStore name; defaults to <fullname>-object-store
    # @param appStorage.psql.objectStore.namespace                     : Override ObjectStore namespace; defaults to common.names.namespace
    # @param appStorage.psql.objectStore.destinationPath               : S3 destination path for backups; e.g. s3://nextcloud-backups
    # @param appStorage.psql.objectStore.endpointURL                   : S3-compatible endpoint URL
    # @param appStorage.psql.objectStore.existingSecret.name           : Existing secret containing S3 credentials; defaults to <fullname>-object-store-secret
    # @param appStorage.psql.objectStore.existingSecret.keys.accessKey : Key name inside the S3 credentials secret for access key ID
    # @param appStorage.psql.objectStore.existingSecret.keys.secretKey : Key name inside the S3 credentials secret for secret access key
    # @param appStorage.psql.objectStore.wal.compression               : Compression algorithm for archived WAL files
    # @param appStorage.psql.objectStore.data.compression              : Compression algorithm for base backup data
    #
    objectStore:
      enabled: false
     
      name: ""
      namespace: ""

      destinationPath: ""
      endpointURL: ""

      existingSecret:
        name: ""
        keys: 
          accessKey: S3_ACCESS_KEY
          secretKey: S3_SECRET_KEY

      wal:
        compression: gzip
      data:
        compression: gzip        

    # ===============================================
    # @subsection backupschedule parameters
    # ===============================================
    #
    # @param appStorage.psql.backupSchedule.enabled    : Enable CNPG ScheduledBackup resource
    # @param appStorage.psql.backupSchedule.name       : Override ObjectStore name; defaults to <fullname>-scheduled-backup
    # @param appStorage.psql.backupSchedule.immediate  : Enable immediate backup after backup resource installation
    # @param appStorage.psql.backupSchedule.schedule   : ScheduledBackup cron expression
    # @param appStorage.psql.backupSchedule.pluginName : Plugin name used by ScheduledBackup
    #
    backupSchedule:
      enabled: false
      name: ""
      immediate: true
      schedule: "0 0 * * *"
      pluginName: barman-cloud.cloudnative-pg.io
